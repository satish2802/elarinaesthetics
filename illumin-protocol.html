<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ILLUMIN — Product sheet</title>
    <style>
        * { box-sizing: border-box; }
        html {
            background: linear-gradient(165deg, #e8f4fc 0%, #fdf6f0 45%, #f3e8ff 100%);
            min-height: 100%;
        }
        body {
            margin: 0;
            padding: 1rem 0.75rem 2.5rem;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 15px;
            color: #2a2a35;
        }
        .wrap { max-width: 920px; margin: 0 auto; }
        .top {
            background: linear-gradient(135deg, #0d6efd 0%, #6f42c1 55%, #d63384 100%);
            padding: 1rem 1.1rem 1.25rem;
            border-radius: 1rem;
            margin-bottom: 1.35rem;
            box-shadow: 0 8px 24px rgba(13, 110, 253, 0.25);
        }
        .back { margin-bottom: 0.35rem; }
        .back a {
            color: rgba(255,255,255,0.95);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .back a:hover { text-decoration: underline; color: #fff; }
        h1 {
            font-size: 1.35rem;
            font-weight: 800;
            margin: 0;
            color: #fff;
            letter-spacing: -0.02em;
            text-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }
        .section-label {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #6f42c1;
            margin: 0 0 0.4rem 0.15rem;
        }
        .page {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 1.35rem;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow:
                0 4px 6px rgba(13, 110, 253, 0.08),
                0 12px 28px rgba(111, 66, 193, 0.12),
                0 0 0 3px rgba(255, 182, 193, 0.35);
        }
        .page img {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="top">
            <p class="back"><a href="index.html#brand2">← Back to brands</a></p>
            <h1>ILLUMIN Biphasic Peel</h1>
        </div>

        <p class="section-label">Page 1</p>
        <div class="page">
            <img src="img/illumin-literature/page_1_screenshot.png" alt="ILLUMIN — page 1 (illumin final.pdf)">
        </div>

        <p class="section-label">Page 2</p>
        <div class="page">
            <img src="img/illumin-literature/page_2_screenshot.png" alt="ILLUMIN — page 2 (illumin final.pdf)">
        </div>
    </div>
</body>
</html>
